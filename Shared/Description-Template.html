<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @page {
    size: letter portrait;
    margin: 0;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 8.5in;
    height: auto;
    margin: 0;
    padding: 0;
    background: #fff;
    font-family: 'Arial', sans-serif;
  }

  /* ---- LEVEL PAGE CONTAINER ---- */
  .level-page {
    width: 8.5in;
    min-height: 11in;
    padding: 0.45in 0.45in 0.4in 0.45in;
    page-break-after: always;
    break-after: page;
    page-break-inside: avoid;
    break-inside: avoid;
    display: flex;
    flex-direction: column;
  }

  @media print {
    html, body {
      width: 8.5in;
      -webkit-print-color-adjust: exact;
    }
    .level-page {
      page-break-after: always;
      break-after: page;
    }
  }

  /* ---- PAGE HEADER — mirrors spell card title banner ---- */
  .page-header {
    display: flex;
    align-items: center;
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .title-banner {
    flex: 1;
    border: 2.5px solid #000;
    border-radius: 16px;
    padding: 0 18px 0 14px;
    background: #fff;
    margin-right: -12px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .title-text {
    font-size: 13pt;
    font-weight: 900;
    text-align: center;
    letter-spacing: 0.5px;
  }

  .hex-badge {
    width: 36px;
    height: 41px;
    flex-shrink: 0;
    z-index: 3;
  }

  /* ---- DIVIDER LINE below header, mirrors stats-grid top border ---- */
  .header-rule {
    border: none;
    border-top: 2.5px solid #000;
    margin: 0 0 10px 0;
  }

  /* ---- TWO COLUMN BODY ---- */
  .columns {
  column-count: 2;
  column-gap: 0.3in;
  flex-grow: 1;
}

  /* ---- INDIVIDUAL CONTENT ENTRY ---- */
  .content-entry {
    page-break-inside: avoid; /* Legacy support */
    break-inside: avoid;      /* Modern standard */
    break-inside: avoid-column; /* Multi-column specific */
    margin-bottom: 12px;
  }
  /* Content name — small caps style via font-variant */
  .content-name {
    font-size: 9.5pt;
    font-weight: 900;
    font-variant: small-caps;
    line-height: 1.1;
    margin: 0 0 1px 0;
  }

  /* Subtitle / category information */
  .content-subtitle {
    font-size: 7.5pt;
    font-style: italic;
    margin: 0 0 3px 0;
    color: #222;
  }

  /* Property lines */
  .content-properties {
    margin: 0 0 4px 0;
  }

  .content-property {
    font-size: 7.5pt;
    line-height: 1.3;
    margin: 0;
  }

  .content-property .prop-label {
    font-weight: bold;
  }

  /* Body text */
  .content-body {
    font-size: 7.5pt;
    line-height: 1.35;
    text-align: justify;
    margin: 0;
  }

  .content-body p {
    margin: 0 0 3px 0;
  }

  /* Named options e.g. "Aquatic Adaptation." inline bold italic */
  .content-body b i,
  .content-body i b {
    font-style: italic;
    font-weight: bold;
  }

  /* Source line — small, right-aligned, de-emphasised */
  .content-source {
    font-size: 6pt;
    color: #666;
    font-style: italic;
    text-align: right;
    margin-top: 2px;
  }

  /* ---- PAGE FOOTER — mirrors card footer ---- */
  .page-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 4px 2px 0 2px;
    height: 24px;
    font-size: 6.5pt;
    font-style: italic;
    font-weight: bold;
    border-top: 1.5px solid #000;
    margin-top: 10px;
    flex-shrink: 0;
  }

  .page-footer .footer-right {
    font-weight: normal;
    color: #444;
  }
</style>
</head>
<body>
  <!-- LEVEL_PAGES_PLACEHOLDER -->
</body>
</html>
